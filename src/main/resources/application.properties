# ─── Server ───────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ─── PostgreSQL ───────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/apcode_db
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ──────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ─── JWT ──────────────────────────────────────────────────
# IMPORTANT: Change this secret to a strong 256-bit base64 key in production
app.jwt.secret=YXBjb2RlLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi0yMDI2LWFiaGlzaGVrLXBhbmRleQ==
app.jwt.expiration-ms=86400000
# 24 hours = 86400000 ms

# ─── CORS ─────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500

# ─── App Config ───────────────────────────────────────────
app.name=AP_Code Platform
app.version=1.0.0

# ─── Logging ──────────────────────────────────────────────
logging.level.com.apcode=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
